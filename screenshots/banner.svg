<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="LiveContainer Plus">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#101a2e"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#60a5fa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
    <style>
      .grid line { stroke: #1e293b; stroke-width: 1; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
      .card { fill: #0f172a; stroke: #1e293b; }
      .card-title { fill: #e2e8f0; font-size: 15px; font-weight: 600; }
      .card-sub { fill: #94a3b8; font-size: 12px; }
      .tick { stroke: #22c55e; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      @keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      @keyframes drift { from { transform: translateX(-620px); } to { transform: translateX(1320px); } }
      @keyframes pulse { 0%,100% { opacity: 0.25; } 50% { opacity: 0.6; } }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .rise { animation: rise 700ms cubic-bezier(.2,.7,.2,1) both; }
      .d1 { animation-delay: 120ms; } .d2 { animation-delay: 260ms; } .d3 { animation-delay: 400ms; } .d4 { animation-delay: 540ms; }
      .beam { animation: drift 6s linear infinite; }
      .glow { animation: pulse 4s ease-in-out infinite; }
      .tick { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw 500ms ease-out forwards; }
      .t1 { animation-delay: 900ms; } .t2 { animation-delay: 1050ms; } .t3 { animation-delay: 1200ms; } .t4 { animation-delay: 1350ms; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <g class="grid" opacity="0.6">
      <line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="240" x2="1200" y2="240"/>
      <line x1="200" y1="0" x2="200" y2="320"/><line x1="400" y1="0" x2="400" y2="320"/><line x1="600" y1="0" x2="600" y2="320"/><line x1="800" y1="0" x2="800" y2="320"/><line x1="1000" y1="0" x2="1000" y2="320"/>
    </g>
    <ellipse class="glow" cx="300" cy="140" rx="380" ry="160" fill="url(#glow)"/>
    <rect class="beam" x="0" y="0" width="620" height="320" fill="url(#beam)" opacity="0.18"/>

    <!-- app icon -->
    <g transform="translate(64 84)">
      <rect width="112" height="112" rx="26" fill="#1d4ed8"/>
      <rect x="18" y="18" width="76" height="76" rx="16" fill="#0b0f19" opacity="0.9"/>
      <rect x="30" y="30" width="24" height="24" rx="6" fill="#60a5fa"/>
      <rect x="58" y="30" width="24" height="24" rx="6" fill="#93c5fd"/>
      <rect x="30" y="58" width="24" height="24" rx="6" fill="#93c5fd"/>
      <rect x="58" y="58" width="24" height="24" rx="6" fill="#22c55e"/>
    </g>

    <!-- title -->
    <g class="sans">
      <text class="rise" x="204" y="126" font-size="54" font-weight="800" fill="url(#title)" letter-spacing="-1">LiveContainer</text>
      <text class="rise d1" x="588" y="126" font-size="54" font-weight="300" fill="#60a5fa">Plus</text>
      <text class="rise d2" x="206" y="164" font-size="18" fill="#94a3b8">One app slot. Every app you sideload. Now with groups, backups and a certificate that warns you first.</text>
      <text class="rise d3 mono" x="206" y="196" font-size="13" fill="#64748b">fork of LiveContainer/LiveContainer  ·  built on GitHub Actions  ·  installed and run on iPhone 17, iOS 26.6</text>
    </g>

    <!-- feature cards -->
    <g class="sans" transform="translate(206 222)">
      <g class="rise d1">
        <rect class="card" width="228" height="70" rx="12"/>
        <path class="tick t1" d="M16 36 l8 8 l14 -16"/>
        <text class="card-title" x="48" y="30">App groups</text>
        <text class="card-sub" x="48" y="50">filter chips, drag-free sorting</text>
      </g>
      <g class="rise d2" transform="translate(244 0)">
        <rect class="card" width="228" height="70" rx="12"/>
        <path class="tick t2" d="M16 36 l8 8 l14 -16"/>
        <text class="card-title" x="48" y="30">Backup and restore</text>
        <text class="card-sub" x="48" y="50">one archive, scheduled, restorable</text>
      </g>
      <g class="rise d3" transform="translate(488 0)">
        <rect class="card" width="228" height="70" rx="12"/>
        <path class="tick t3" d="M16 36 l8 8 l14 -16"/>
        <text class="card-title" x="48" y="30">Certificate health</text>
        <text class="card-sub" x="48" y="50">days-left banner, not a surprise</text>
      </g>
      <g class="rise d4" transform="translate(732 0)">
        <rect class="card" width="228" height="70" rx="12"/>
        <path class="tick t4" d="M16 36 l8 8 l14 -16"/>
        <text class="card-title" x="48" y="30">Bulk sources</text>
        <text class="card-sub" x="48" y="50">paste a list, add them all, export</text>
      </g>
    </g>
  </g>
</svg>
